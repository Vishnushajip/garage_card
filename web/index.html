<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WeFix is a modern vehicle service and garage management platform for motorcycles, scooters, cars, and all vehicle types.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WeFix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WeFix | Vehicle Service Platform</title>
  <meta name="google-signin-client_id" content="62265849009-mushlhju9uianaf4aqq4qtcj11kfiij5.apps.googleusercontent.com">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js')
          .then(function (registration) {
            console.log('Firebase Messaging ServiceWorker registered with scope: ', registration.scope);
          })
          .catch(function (err) {
            console.log('Firebase Messaging ServiceWorker registration failed: ', err);
          });
      });
    }

    window.showWebNotification = function(title, body, imageUrl, deepLink) {
      if (!("Notification" in window)) return;
      if (Notification.permission === "granted") {
        var options = {
          body: body || '',
          icon: '/assets/branding/wefix_app_icon.png',
          badge: '/favicon.png',
          data: { deepLink: deepLink || '/' }
        };
        if (imageUrl) {
          options.image = imageUrl;
        }
        if (navigator.serviceWorker && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then(function(reg) {
            reg.showNotification(title || 'WeFix Alert', options);
          }).catch(function() {
            new Notification(title || 'WeFix Alert', options);
          });
        } else {
          new Notification(title || 'WeFix Alert', options);
        }
      } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(function(perm) {
          if (perm === "granted") {
            window.showWebNotification(title, body, imageUrl, deepLink);
          }
        });
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
