      var _k = String.fromCharCode.apply(null, _p.map(function (b) { return b ^ 0x5A; }));
      var s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + _k + '&libraries=places';
      s.async = true;
      document.head.appendChild(s);

    window.wefixSearchPlaces = function (query, lat, lng, callback) {
      try {
        if (!window.google || !window.google.maps || !window.google.maps.places) {
          callback(JSON.stringify([]));
          return;
        }
        var service = new google.maps.places.PlacesService(document.createElement('div'));
        var req = { query: query };
        if (lat != null && lng != null) {
          req.location = new google.maps.LatLng(lat, lng);
          req.radius = 25000;
        }
        service.textSearch(req, function (results, status) {
          if (status === google.maps.places.PlacesServiceStatus.OK && results && results.length > 0) {
            var items = results.slice(0, 10).map(function (r) {
              return {
                name: r.name || '',
                formatted_address: r.formatted_address || '',
                lat: r.geometry && r.geometry.location ? r.geometry.location.lat() : 0,
                lng: r.geometry && r.geometry.location ? r.geometry.location.lng() : 0
              };
            });
            callback(JSON.stringify(items));
          } else {
            callback(JSON.stringify([]));
          }
        });
      } catch (e) {
        callback(JSON.stringify([]));
      }
    };

    window.wefixReverseGeocode = function (lat, lng, callback) {
      try {
        if (!window.google || !window.google.maps) {
          callback(JSON.stringify(null));
          return;
        }
        var geocoder = new google.maps.Geocoder();
        geocoder.geocode({ location: { lat: lat, lng: lng } }, function (results, status) {
          if (status === 'OK' && results && results.length > 0) {
            var r = results[0];
            callback(JSON.stringify({
              formatted_address: r.formatted_address || '',
              address_components: r.address_components || []
            }));
          } else {
            callback(JSON.stringify(null));
          }
        });
      } catch (e) {
        callback(JSON.stringify(null));
      }
    };
    window['window.wefixSearchPlaces'] = window.wefixSearchPlaces;
    window['window.wefixReverseGeocode'] = window.wefixReverseGeocode;
  </script>

  <style>
    :root {
      --wf-bg: #FFFFFF;
      --wf-ink: #0F172A;
      --wf-muted: #64748B;
      --wf-red: #DC2626;
      --wf-red-dark: #B91C1C;
      --wf-red-light: #EF4444;
      --wf-red-muted: #FEE2E2;
      --wf-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --wf-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--wf-bg);
      color: var(--wf-ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--wf-bg);
      opacity: 1;
      transition: opacity 0.5s var(--wf-ease), transform 0.5s var(--wf-ease);
    }

    #app-splash.is-leaving {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .splash-corner {
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      will-change: transform, opacity;
    }

    .splash-corner.tl {
      top: -35vmax;
      left: -35vmax;
      background: radial-gradient(circle, var(--wf-red-light) 0%, rgba(239, 68, 68, 0.55) 28%, var(--wf-red-muted) 52%, rgba(254, 226, 226, 0) 70%);
      transform-origin: 50% 50%;
      animation: corner-fill 1.5s var(--wf-ease) 0.05s forwards;
    }

    .splash-corner.tr {
      top: -35vmax;
      right: -35vmax;
      background: radial-gradient(circle, var(--wf-red) 0%, rgba(220, 38, 38, 0.5) 28%, var(--wf-red-muted) 52%, rgba(254, 226, 226, 0) 70%);
      animation: corner-fill 1.5s var(--wf-ease) 0.18s forwards;
    }

    .splash-corner.bl {
      bottom: -35vmax;
      left: -35vmax;
      background: radial-gradient(circle, var(--wf-red-dark) 0%, rgba(185, 28, 28, 0.5) 28%, var(--wf-red-muted) 52%, rgba(254, 226, 226, 0) 70%);
      animation: corner-fill 1.5s var(--wf-ease) 0.3s forwards;
    }

    .splash-corner.br {
      bottom: -35vmax;
      right: -35vmax;
      background: radial-gradient(circle, var(--wf-red-light) 0%, rgba(239, 68, 68, 0.55) 28%, var(--wf-red-muted) 52%, rgba(254, 226, 226, 0) 70%);
      animation: corner-fill 1.5s var(--wf-ease) 0.42s forwards;
    }

    .splash-veil {
      position: absolute;
      inset: 0;
      background: radial-gradient(48% 42% at 50% 46%, rgba(255, 255, 255, 0.96) 0%, rgba(255, 255, 255, 0.82) 55%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
    }

    .splash-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .splash-stage {
      position: relative;
      width: 128px;
      height: 128px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--wf-red);
      opacity: 0;
      transform: scale(0.7);
      animation: ring-ripple 2.4s cubic-bezier(0.2, 0.6, 0.3, 1) infinite;
    }

    .splash-ring.r1 {
      animation-delay: 0.7s;
    }

    .splash-ring.r2 {
      animation-delay: 1.5s;
      border-color: var(--wf-red-light);
    }

    .splash-ring.r3 {
      animation-delay: 2.3s;
      border-color: var(--wf-red-dark);
    }

    .splash-fill {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--wf-red-light) 0%, var(--wf-red) 55%, var(--wf-red-dark) 100%);
      clip-path: circle(0% at 50% 100%);
      opacity: 0;
      animation: fill-rise 0.85s var(--wf-ease) 0.15s forwards;
      box-shadow: 0 18px 44px rgba(220, 38, 38, 0.38);
    }

    .splash-logo {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 26px;
      background: #FFFFFF;
      opacity: 0;
      transform: scale(0.4);
      animation: logo-pop 0.8s var(--wf-pop) 0.55s forwards;
      box-shadow:
        0 0 0 6px rgba(254, 226, 226, 0.95),
        0 0 0 7px rgba(220, 38, 38, 0.18),
        0 14px 34px rgba(185, 28, 28, 0.32);
    }

    .splash-logo img {
      width: 100%;
      height: 100%;
      border-radius: 26px;
      object-fit: contain;
      display: block;
    }

    .splash-title {
      margin: 0 0 8px 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.9px;
      line-height: 1.1;
      color: var(--wf-ink);
      opacity: 0;
      transform: scale(0.92);
      animation: fade-scale 0.8s var(--wf-ease) 0.95s forwards;
    }

    .splash-title span {
      color: var(--wf-red);
    }

    .splash-subtitle {
      margin: 0;
      padding: 7px 14px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--wf-red-dark);
      background: var(--wf-red-muted);
      border-radius: 999px;
      opacity: 0;
      transform: scale(0.94);
      animation: fade-scale 0.8s var(--wf-ease) 1.1s forwards;
    }

    @keyframes corner-fill {
      0% {
        opacity: 0;
        transform: scale(0);
      }

      40% {
        opacity: 0.55;
      }

      100% {
        opacity: 0.32;
        transform: scale(1);
      }
    }

    @keyframes fill-rise {
      0% {
        opacity: 1;
        clip-path: circle(0% at 50% 100%);
      }

      100% {
        opacity: 1;
        clip-path: circle(100% at 50% 50%);
      }
    }

    @keyframes logo-pop {
      0% {
        opacity: 0;
        transform: scale(0.4);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes ring-ripple {
      0% {
        opacity: 0;
        transform: scale(0.75);
      }

      15% {
        opacity: 0.55;
      }

      100% {
        opacity: 0;
        transform: scale(2.1);
      }
    }

    @keyframes fade-scale {
      from {
        opacity: 0;
        transform: scale(0.92);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .splash-corner,
      .splash-fill,
      .splash-logo,
      .splash-title,
      .splash-subtitle {
        animation-duration: 0.01s;
        animation-delay: 0s;
      }

      .splash-ring {
        animation: none;
      }

      #app-splash {
        transition-duration: 0.01s;
      }
    }

    .seo-fallback {
      max-width: 920px;
      margin: 0 auto;
      padding: 56px 24px;
      line-height: 1.65;
      color: var(--wf-ink);
    }

    .seo-fallback h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.8px;
      line-height: 1.15;
      margin: 0 0 14px 0;
    }

    .seo-fallback h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin: 36px 0 12px 0;
    }

    .seo-fallback p {
      color: var(--wf-muted);
      margin: 0 0 8px 0;
    }

    .seo-fallback ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .seo-fallback li {
      padding: 14px 16px;
      border: 1px solid var(--wf-red-muted);
      border-left: 3px solid var(--wf-red);
      border-radius: 14px;
      background: #FFFFFF;
      color: var(--wf-muted);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .seo-fallback a {
      color: var(--wf-red);
      font-weight: 600;
      text-decoration: none;
    }

    .seo-fallback a:hover {
      color: var(--wf-red-dark);
      text-decoration: underline;
    }
  </style>

  </noscript>
</head>

  <script>
    if ('serviceWorker' in navigator) {
      var registerFcmSw = function () {
        navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' })

            console.log('Firebase Messaging ServiceWorker registered with scope: ', registration.scope);
          })
          .catch(function (err) {
            console.log('Firebase Messaging ServiceWorker registration failed: ', err);
          });
      };
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        registerFcmSw();
      } else {
        window.addEventListener('load', registerFcmSw);
      }
    }

    window.addEventListener('webglcontextlost', function (event) {

    function removeAppSplash() {
      var splash = document.getElementById('app-splash');
      if (splash && !splash.classList.contains('is-leaving')) {
        splash.classList.add('is-leaving');
        setTimeout(function () {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 520);
      }
    }
    window.wefixAppReady = removeAppSplash;
    window.addEventListener('flutter-first-frame', removeAppSplash);
    setTimeout(removeAppSplash, 3500);

    window.showWebNotification = function (title, body, imageUrl, deepLink) {
      if (!("Notification" in window)) return;
      if (Notification.permission === "granted") {
        var options = {
          body: body || '',
          icon: '/icons/Icon-192.png',
          badge: '/favicon.png',
          data: { deepLink: deepLink || '/' }
        };
        if (imageUrl) {
          options.image = imageUrl;
        }
        if (navigator.serviceWorker && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then(function (reg) {
            reg.showNotification(title || 'WeFix Alert', options);
          }).catch(function () {
            new Notification(title || 'WeFix Alert', options);
          });
        } else {
          new Notification(title || 'WeFix Alert', options);
        }
      } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(function (perm) {
          if (perm === "granted") {
            window.showWebNotification(title, body, imageUrl, deepLink);
          }
        });
      }
    };
  </script>
